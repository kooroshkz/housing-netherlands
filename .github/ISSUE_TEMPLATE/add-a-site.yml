name: Add a website
description: A housing website that should be on the list
title: "Add: "
labels: ["add"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to the listings or apply page
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: Who can rent there?
      multiple: true
      options: [Students, PhD candidates, Working people]
    validations:
      required: true
  - type: input
    id: cities
    attributes:
      label: Cities
      placeholder: Leiden, Delft
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How do you get a place?
      description: Waiting list, lottery, first come, booking, fees. A link that shows it helps.
